<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이제 고민하지 마! 내가 골라 줄게</title>
    <!-- 귀여운 둥근 폰트 (Jua) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 이미지 크롭 라이브러리 (Cropper.js) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #fdf5e6;
            background-image: 
                linear-gradient(90deg, rgba(162, 212, 195, 0.25) 50%, transparent 50%),
                linear-gradient(rgba(243, 178, 185, 0.25) 50%, transparent 50%);
            background-size: 50px 50px;
            color: #5c4332;
            font-family: 'Jua', sans-serif;
            font-weight: 400; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 10px 10px 20px 10px; 
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 auto; 
        }

        /* ---------------- [ 상단 우드 간판 ] ---------------- */
        .wood-sign {
            background-color: #d4a373;
            color: #fff;
            padding: 6px 35px; 
            border-radius: 10px; 
            font-size: 14px; 
            text-shadow: 1px 1px 0px #ab7a4b;
            border: 2px solid #ab7a4b;
            margin-top: 18px; 
            margin-bottom: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 0px rgba(212, 163, 115, 0.2); 
        }
        
        .wood-sign::before, .wood-sign::after {
            content: '';
            position: absolute;
            top: -18px; 
            width: 8px;
            height: 18px;
            background-color: #a87e5b; 
            border: 2px solid #8c5a2b; 
            border-bottom: none; 
            z-index: -1; 
        }
        .wood-sign::before { left: 20px; }
        .wood-sign::after { right: 20px; }

        .nail {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #78716c; 
            border-radius: 50%;
            top: 5px;
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.4), 1px 1px 1px rgba(0,0,0,0.3);
        }
        .nail-left { left: 21px; }
        .nail-right { right: 21px; }

        /* ---------------- [ 인덱스 탭 ] ---------------- */
        .tabs {
            display: flex;
            justify-content: center;
            width: 90%;
            gap: 3px;
            margin-bottom: -4px; 
            z-index: 1;
            align-items: flex-end; 
        }

        .tab-btn {
            font-family: 'Jua', sans-serif;
            font-weight: 400;
            flex: 1;
            padding: 8px 2px 12px 2px; 
            font-size: 13px; 
            border: 2px solid #d4a373;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease-in-out;
            box-shadow: inset 0 3px 0px rgba(255, 255, 255, 0.4);
            color: #5c4332;
            position: relative;
            z-index: 1;
        }
        
        .tab-btn.active {
            transform: translateY(-4px); 
            padding-bottom: 16px; 
            z-index: 5;
            box-shadow: inset 0 4px 0px rgba(255, 255, 255, 0.6), 0 -2px 5px rgba(0,0,0,0.05);
            font-size: 13.5px; 
        }

        .tab-do { background-color: #c5e3d5; } 
        .tab-buy { background-color: #f6c5c8; }
        .tab-eat { background-color: #fce19a; }

        /* ---------------- [ 메인 게임 창 ] ---------------- */
        .game-window {
            background-color: #fffbf2;
            padding: 15px 12px 18px; 
            width: 100%;
            border: 3px solid #d4a373;
            border-radius: 16px;
            box-shadow: 
                inset 0 0 0 5px #f4e8d3,
                0 6px 0px rgba(212, 163, 115, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* 포토카드 (맨 위로 이동) */
        .photocard-wrapper {
            width: 250px; 
            height: 360px; 
            background-color: #fdf5e6;
            border: 6px solid #d4a373;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 6px rgba(92, 67, 50, 0.2), 3px 3px 0 rgba(212, 163, 115, 0.3);
            transition: transform 0.2s;
            margin-bottom: 15px; /* 말풍선과의 간격 */
        }
        .photocard-wrapper:hover {
            transform: rotate(-2deg) scale(1.02);
        }
        .photocard-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 4px;
        }
        .upload-text {
            color: #a87e5b;
            font-size: 15px;
            text-align: center;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .upload-text .paw {
            font-size: 28px;
        }
        input[type="file"] {
            display: none;
        }

        /* 구름 말풍선 (사진 아래로 이동 & 꼬리가 위를 향하게 수정) */
        .speech-cloud {
            position: relative;
            background: #ffffff;
            color: #5c4332;
            font-size: 15px; 
            padding: 10px 12px; 
            width: 90%;
            border: 3px solid #d4a373;
            border-radius: 16px 10px 16px 10px;
            text-align: center;
            min-height: 40px; 
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            box-shadow: 2px 2px 0px rgba(212, 163, 115, 0.2);
            line-height: 1.2;
        }
        /* 말풍선 꼬리가 위를 향하도록 수정 (사진이 위에서 말하는 느낌) */
        .speech-cloud::after {
            content: '';
            position: absolute;
            top: -10px; /* 위쪽으로 꼬리 배치 */
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-top: 3px solid #d4a373;
            border-left: 3px solid #d4a373;
            border-top-left-radius: 4px;
        }
        
        .deco { position: absolute; font-size: 12px; }
        .deco-1 { left: 6px; top: 6px; }
        .deco-2 { right: 6px; top: -8px; font-size: 14px; }
        .deco-3 { right: 6px; bottom: 4px; font-size: 10px; }
        .deco-4 { left: 10px; bottom: -8px; font-size: 14px; }

        /* ---------------- [ 크롭 모달창 ] ---------------- */
        .crop-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); 
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .crop-popup-container {
            background-color: #fffbf2;
            width: 100%;
            max-width: 400px;
            border: 4px solid #d4a373;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .img-container {
            width: 100%;
            max-height: 55vh;
            background-color: #222; 
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-container img {
            display: block;
            max-width: 100%;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .modal-buttons button {
            font-family: 'Jua', sans-serif;
            font-weight: 400;
            flex: 1;
            padding: 10px;
            font-size: 18px;
            border: 3px solid #d4a373;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f3e5d0;
            color: #5c4332;
            transition: background-color 0.1s;
        }
        .modal-buttons button:active {
            background-color: #e6d3b8;
        }

        /* ---------------- [ PC / 태블릿 화면 ] ---------------- */
        @media (min-width: 480px) {
            body {
                justify-content: center;
                padding: 30px 10px;
            }
            .app-container {
                margin: auto;
            }

            .wood-sign {
                padding: 8px 45px;
                border-radius: 12px;
                font-size: 16px;
                border-width: 3px;
                margin-top: 30px;
                margin-bottom: 25px;
            }
            .wood-sign::before, .wood-sign::after { 
                width: 10px; 
                height: 30px; 
                top: -28px; 
                border-width: 3px; 
            }
            .wood-sign::before { left: 25px; }
            .wood-sign::after { right: 25px; }
            
            .nail { width: 8px; height: 8px; top: 7px; }
            .nail-left { left: 26px; }
            .nail-right { right: 26px; }
            
            .tabs { gap: 5px; margin-bottom: -4px; }
            .tab-btn {
                padding: 8px 2px 14px 2px;
                font-size: 16px;
                border-width: 3px;
                border-radius: 14px 14px 0 0;
            }
            .tab-btn.active {
                transform: translateY(-5px); 
                padding-bottom: 19px;
                font-size: 17px;
            }

            .game-window {
                padding: 25px 15px 30px;
                border-width: 4px;
                border-radius: 20px;
                box-shadow: inset 0 0 0 6px #f4e8d3, 0 8px 0px rgba(212, 163, 115, 0.3);
            }

            .speech-cloud {
                font-size: 17px;
                padding: 12px 14px;
                min-height: 50px;
                border-radius: 18px 12px 18px 12px;
            }

            .photocard-wrapper {
                width: 250px; 
                height: 360px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 1. 밖으로 꺼내고 매달린 효과를 준 우드 간판 -->
        <div class="wood-sign">
            <div class="nail nail-left"></div>
            <div class="nail nail-right"></div>
            이제 고민하지 마! 내가 골라 줄게
        </div>

        <!-- 2. 상단 아기자기한 인덱스 탭 -->
        <div class="tabs">
            <button class="tab-btn tab-do" onclick="decide('do')">할/말 🍃</button>
            <button class="tab-btn tab-buy" onclick="decide('buy')">살/말 👛</button>
            <button class="tab-btn tab-eat" onclick="decide('eat')">먹/말 🧺</button>
        </div>

        <!-- 3. 메인 게임 창 -->
        <div class="game-window">
            <!-- 포토카드 (위쪽으로 이동) -->
            <label for="imageUpload" class="photocard-wrapper" id="photoWrapper">
                <div class="upload-text" id="uploadText">
                    <span class="paw">📸</span>
                    클릭해서<br>사진 넣기
                </div>
                <img id="previewImage" alt="최애 포토카드">
            </label>
            <input type="file" id="imageUpload" accept="image/*">

            <!-- 구름 말풍선 (아래쪽으로 이동, 꼬리가 위를 향함) -->
            <div class="speech-cloud" id="speechBubble">
                <span class="deco deco-1">✨</span>
                <span class="deco deco-2">🍎</span>
                <span class="deco deco-3">💕</span>
                <span class="deco deco-4">🍓</span>
                위에 있는 탭을 눌러봐!
            </div>
        </div>
    </div>

    <!-- 이미지 자르기 모달창 -->
    <div class="crop-popup-overlay" id="cropPopup">
        <div class="crop-popup-container">
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <div class="modal-buttons">
                <button id="cancelCropBtn">취소</button>
                <button id="applyCropBtn">자르기 완료</button>
            </div>
        </div>
    </div>

    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const previewImage = document.getElementById('previewImage');
        const uploadText = document.getElementById('uploadText');
        const speechBubble = document.getElementById('speechBubble');
        const popSound = document.getElementById('popSound');

        // 크롭 관련 요소들
        const cropPopup = document.getElementById('cropPopup');
        const imageToCrop = document.getElementById('imageToCrop');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const applyCropBtn = document.getElementById('applyCropBtn');
        let cropper = null;

        window.onload = function() {
            const savedImage = localStorage.getItem('biasPhoto');
            if (savedImage) {
                previewImage.src = savedImage;
                previewImage.style.display = 'block';
                uploadText.style.display = 'none';
            }
        };

        // 1. 파일 선택 시 크롭 모달창 띄우기
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageToCrop.src = event.target.result;
                    cropPopup.style.display = 'flex';
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 250 / 360, 
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.9,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        });

        // 2. 크롭 취소 버튼
        cancelCropBtn.addEventListener('click', function() {
            cropPopup.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        });

        // 3. 자르기 완료 버튼
        applyCropBtn.addEventListener('click', function() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas({
                width: 500, 
                height: 720
            });

            const croppedBase64 = canvas.toDataURL('image/jpeg', 0.9);

            previewImage.src = croppedBase64;
            previewImage.style.display = 'block';
            uploadText.style.display = 'none';
            localStorage.setItem('biasPhoto', croppedBase64);

            cropPopup.style.display = 'none';
            cropper.destroy();
            cropper = null;
        });

        // ------------------ [ 기존 슬롯머신 로직 ] ------------------

        const doList = [
            "할까 말까 할 때는 해야지",
            "왠지 고민이 돼? 그럼 잠깐 쉴까?",
            "그래도 해야지",
            "좀 더 고민해 보는 게 어때?"
        ];

        const buyList = [
            "당장 장바구니 ㄱㄱ",
            "지갑 닫자 통장 운다",
            "살까 말까 할 땐 사서 남겨",
            "이 돈 아껴서 나중에 더 좋은 거 사자"
        ];

    const eatList = [
            "참을 수 있다 ^^",
            "먹고 죽은 귀신이? 때깔도 곱다",
            "어~ 안 돼~ 일찍 자~",
            "뭐 해? 아직 안 시켰어?"
        ];

        let isRolling = false;

        function decide(type) {
            if (isRolling) return; 
            isRolling = true;

            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("오디오 재생 권한 필요"));

            // 모든 탭의 튀어나온 효과(active) 제거
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // 선택된 탭에만 튀어나오는 효과 추가
            if (type === 'do') document.querySelector('.tab-do').classList.add('active');
            else if (type === 'buy') document.querySelector('.tab-buy').classList.add('active');
            else if (type === 'eat') document.querySelector('.tab-eat').classList.add('active');

            let list = [];
            if (type === 'do') list = doList;
            else if (type === 'buy') list = buyList;
            else if (type === 'eat') list = eatList;

            let counter = 0;
            let maxRolls = 12; 
            let rollInterval = setInterval(() => {
                let randomText = list[Math.floor(Math.random() * list.length)];
                speechBubble.innerHTML = `
                    <span class="deco deco-1">✨</span>
                    <span class="deco deco-2">🍎</span>
                    <span class="deco deco-3">💕</span>
                    <span class="deco deco-4">🍓</span>
                    ${randomText}
                `;
                counter++;

                if (counter >= maxRolls) {
                    clearInterval(rollInterval);
                    let finalChoice = list[Math.floor(Math.random() * list.length)];
                    
                    speechBubble.innerHTML = `
                        <span class="deco deco-1">✨</span>
                        <span class="deco deco-2">🍎</span>
                        <span class="deco deco-3">💕</span>
                        <span class="deco deco-4">🍓</span>
                        ${finalChoice}
                    `;
                    isRolling = false;
                }
            }, 60); 
        }
    </script>
</body>
</html>
