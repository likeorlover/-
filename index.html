<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이제 고민하지 마! 내가 골라 줄게</title>
    <!-- 귀여운 둥근 폰트 (Jua) 롤백 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 이미지 크롭 라이브러리 (Cropper.js) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #fdf5e6;
            background-image: 
                linear-gradient(90deg, rgba(162, 212, 195, 0.25) 50%, transparent 50%),
                linear-gradient(rgba(243, 178, 185, 0.25) 50%, transparent 50%);
            background-size: 50px 50px;
            color: #5c4332;
            font-family: 'Jua', sans-serif;
            font-weight: 400; /* 폰트 얇게 (기본 굵기) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 10px;
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: auto;
        }

        /* ---------------- [ 상단 우드 간판 ] ---------------- */
        .wood-sign {
            background-color: #d4a373;
            color: #fff;
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 20px; 
            text-shadow: 1px 1px 0px #ab7a4b;
            border: 3px solid #ab7a4b;
            margin-bottom: 25px; 
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            position: relative;
            z-index: 10;
        }
        .wood-sign::before, .wood-sign::after {
            content: '📌';
            position: absolute;
            font-size: 14px;
            top: -6px;
        }
        .wood-sign::before { left: 8px; }
        .wood-sign::after { right: 8px; }

        /* ---------------- [ 인덱스 탭 ] ---------------- */
        .tabs {
            display: flex;
            justify-content: center;
            width: 90%;
            gap: 5px;
            margin-bottom: -4px; 
            z-index: 1;
        }

        .tab-btn {
            font-family: 'Jua', sans-serif;
            font-weight: 400;
            flex: 1;
            padding: 8px 2px 14px 2px; 
            font-size: 16px; 
            border: 3px solid #d4a373;
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.1s;
            box-shadow: inset 0 3px 0px rgba(255, 255, 255, 0.4);
            color: #5c4332;
        }
        
        .tab-btn:active {
            transform: translateY(3px);
        }

        .tab-do { background-color: #c5e3d5; } 
        .tab-buy { background-color: #f6c5c8; }
        .tab-eat { background-color: #fce19a; }

        /* ---------------- [ 메인 게임 창 ] ---------------- */
        .game-window {
            background-color: #fffbf2;
            padding: 25px 15px 30px;
            width: 100%;
            border: 4px solid #d4a373;
            border-radius: 20px;
            box-shadow: 
                inset 0 0 0 6px #f4e8d3,
                0 8px 0px rgba(212, 163, 115, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* 상태 표시줄 */
        .category-display {
            background-color: #f3e5d0;
            color: #a87e5b;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 16px; 
            border: 2px dashed #d4a373;
            margin-bottom: 15px;
            text-align: center;
            width: 90%;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 구름 말풍선 */
        .speech-cloud {
            position: relative;
            background: #ffffff;
            color: #5c4332;
            font-size: 17px; 
            padding: 12px 14px; 
            width: 90%;
            border: 3px solid #d4a373;
            border-radius: 18px 12px 18px 12px;
            margin-bottom: 25px;
            text-align: center;
            min-height: 50px; 
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            box-shadow: 3px 3px 0px rgba(212, 163, 115, 0.2);
            line-height: 1.3;
        }
        .speech-cloud::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-bottom: 3px solid #d4a373;
            border-right: 3px solid #d4a373;
            border-bottom-right-radius: 4px;
        }
        
        .deco { position: absolute; font-size: 12px; }
        .deco-1 { left: 6px; top: 6px; }
        .deco-2 { right: 6px; top: -8px; font-size: 16px; }
        .deco-3 { right: 6px; bottom: 4px; font-size: 10px; }
        .deco-4 { left: 10px; bottom: -8px; font-size: 14px; }

        /* 포토카드 */
        .photocard-wrapper {
            width: 170px; 
            height: 245px; 
            background-color: #fdf5e6;
            border: 6px solid #d4a373;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 6px rgba(92, 67, 50, 0.2), 3px 3px 0 rgba(212, 163, 115, 0.3);
            transition: transform 0.2s;
        }
        .photocard-wrapper:hover {
            transform: rotate(-2deg) scale(1.02);
        }
        .photocard-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 4px;
        }
        .upload-text {
            color: #a87e5b;
            font-size: 14px;
            text-align: center;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .upload-text .paw {
            font-size: 26px;
        }
        input[type="file"] {
            display: none;
        }

        /* ---------------- [ 크롭 모달창 (클래스명 충돌 방지 및 가시성 개선) ] ---------------- */
        .crop-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); /* 배경을 아주 어둡게 처리하여 크롭 영역만 돋보이게 함 */
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .crop-popup-container {
            background-color: #fffbf2;
            width: 100%;
            max-width: 400px;
            border: 4px solid #d4a373;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .img-container {
            width: 100%;
            max-height: 55vh;
            background-color: #222; /* 이미지가 잘 보이도록 대비를 줌 */
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-container img {
            display: block;
            max-width: 100%;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .modal-buttons button {
            font-family: 'Jua', sans-serif;
            font-weight: 400;
            flex: 1;
            padding: 10px;
            font-size: 18px;
            border: 3px solid #d4a373;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f3e5d0;
            color: #5c4332;
            transition: background-color 0.1s;
        }
        .modal-buttons button:active {
            background-color: #e6d3b8;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 1. 밖으로 꺼낸 우드 간판 -->
        <div class="wood-sign">이제 고민하지 마! 내가 골라 줄게</div>

        <!-- 2. 상단 아기자기한 인덱스 탭 -->
        <div class="tabs">
            <button class="tab-btn tab-do" onclick="decide('do')">할/말 🍃</button>
            <button class="tab-btn tab-buy" onclick="decide('buy')">살/말 👛</button>
            <button class="tab-btn tab-eat" onclick="decide('eat')">먹/말 🧺</button>
        </div>

        <!-- 3. 메인 게임 창 -->
        <div class="game-window">
            <div class="category-display" id="categoryDisplay">
                위에 있는 탭을 눌러봐! 🐾
            </div>

            <div class="speech-cloud" id="speechBubble">
                <span class="deco deco-1">✨</span>
                <span class="deco deco-2">🍎</span>
                <span class="deco deco-3">💕</span>
                <span class="deco deco-4">🍓</span>
                버튼을 누르면 내가 골라 줄게!
            </div>

            <label for="imageUpload" class="photocard-wrapper" id="photoWrapper">
                <div class="upload-text" id="uploadText">
                    <span class="paw">📸</span>
                    클릭해서<br>사진 넣기
                </div>
                <img id="previewImage" alt="최애 포토카드">
            </label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
    </div>

    <!-- 이미지 자르기 모달창 -->
    <div class="crop-popup-overlay" id="cropPopup">
        <div class="crop-popup-container">
            <div class="img-container">
                <img id="imageToCrop" src="">
            </div>
            <div class="modal-buttons">
                <button id="cancelCropBtn">취소</button>
                <button id="applyCropBtn">자르기 완료</button>
            </div>
        </div>
    </div>

    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const previewImage = document.getElementById('previewImage');
        const uploadText = document.getElementById('uploadText');
        const speechBubble = document.getElementById('speechBubble');
        const categoryDisplay = document.getElementById('categoryDisplay');
        const popSound = document.getElementById('popSound');

        // 크롭 관련 요소들
        const cropPopup = document.getElementById('cropPopup');
        const imageToCrop = document.getElementById('imageToCrop');
        const cancelCropBtn = document.getElementById('cancelCropBtn');
        const applyCropBtn = document.getElementById('applyCropBtn');
        let cropper = null;

        window.onload = function() {
            const savedImage = localStorage.getItem('biasPhoto');
            if (savedImage) {
                previewImage.src = savedImage;
                previewImage.style.display = 'block';
                uploadText.style.display = 'none';
            }
        };

        // 1. 파일 선택 시 크롭 모달창 띄우기
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // 모달창 띄우고 이미지 설정
                    imageToCrop.src = event.target.result;
                    cropPopup.style.display = 'flex';
                    
                    // 기존 크로퍼가 있다면 파괴
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    // 크로퍼 초기화 (포토카드 비율 170:245에 맞춤)
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 170 / 245,
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.9,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                };
                reader.readAsDataURL(file);
            }
            // 같은 파일을 다시 선택해도 작동하도록 value 초기화
            e.target.value = '';
        });

        // 2. 크롭 취소 버튼
        cancelCropBtn.addEventListener('click', function() {
            cropPopup.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        });

        // 3. 자르기 완료 버튼
        applyCropBtn.addEventListener('click', function() {
            if (!cropper) return;

            // 자른 이미지를 데이터(Base64)로 가져오기
            const canvas = cropper.getCroppedCanvas({
                width: 340, // 화질을 위해 실제 픽셀의 2배 크기로 추출
                height: 490
            });

            const croppedBase64 = canvas.toDataURL('image/jpeg', 0.9);

            // 포토카드에 적용 및 저장
            previewImage.src = croppedBase64;
            previewImage.style.display = 'block';
            uploadText.style.display = 'none';
            localStorage.setItem('biasPhoto', croppedBase64);

            // 모달창 닫기 및 크로퍼 파괴
            cropPopup.style.display = 'none';
            cropper.destroy();
            cropper = null;
        });

        // ------------------ [ 기존 슬롯머신 로직 ] ------------------

        const doList = [
            "할까 말까 할 때는 해야지",
            "왠지 고민이 돼? 그럼 잠깐 쉴까?",
            "그래도 해야지",
            "좀 더 고민해 보는 게 어때?"
        ];

        const buyList = [
            "당장 장바구니 ㄱㄱ",
            "지갑 닫자 통장 운다",
            "살까 말까 할 땐 사서 남겨",
            "이 돈 아껴서 나중에 더 좋은 거 사자"
        ];

        const eatList = [
            "참을 수 있다 ^^",
            "먹고 죽은 귀신이? 때깔도 곱다",
            "어~ 안 돼~ 응~ 아니야~",
            "뭐 해? 아직 안 시켰어?"
        ];

        let isRolling = false;

        function decide(type) {
            if (isRolling) return; 
            isRolling = true;

            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("오디오 재생 권한 필요"));

            let list = [];
            let categoryText = "";
            if (type === 'do') {
                list = doList;
                categoryText = "🌿 [ 할/말 ] 고민 중...";
            } else if (type === 'buy') {
                list = buyList;
                categoryText = "👛 [ 살/말 ] 고민 중...";
            } else if (type === 'eat') {
                list = eatList;
                categoryText = "🧺 [ 먹/말 ] 고민 중...";
            }

            categoryDisplay.innerText = categoryText;

            let counter = 0;
            let maxRolls = 12; 
            let rollInterval = setInterval(() => {
                let randomText = list[Math.floor(Math.random() * list.length)];
                speechBubble.innerHTML = `
                    <span class="deco deco-1">✨</span>
                    <span class="deco deco-2">🍎</span>
                    <span class="deco deco-3">💕</span>
                    <span class="deco deco-4">🍓</span>
                    ${randomText}
                `;
                counter++;

                if (counter >= maxRolls) {
                    clearInterval(rollInterval);
                    let finalChoice = list[Math.floor(Math.random() * list.length)];
                    
                    if (type === 'do') categoryText = "🌿 [ 할까? 말까? ] 결정 완료!";
                    else if (type === 'buy') categoryText = "👛 [ 살까? 말까? ] 결정 완료!";
                    else if (type === 'eat') categoryText = "🧺 [ 먹을까? 말까? ] 결정 완료!";
                    categoryDisplay.innerText = categoryText;

                    speechBubble.innerHTML = `
                        <span class="deco deco-1">✨</span>
                        <span class="deco deco-2">🍎</span>
                        <span class="deco deco-3">💕</span>
                        <span class="deco deco-4">🍓</span>
                        ${finalChoice}
                    `;
                    isRolling = false;
                }
            }, 60); 
        }
    </script>
</body>
</html>
