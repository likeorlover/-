<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꼬모의 결정 헬퍼</title>
    <!-- 귀여운 둥근 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* 모든 요소의 크기 계산에 테두리와 여백을 포함하여 화면 밖으로 나가는 것을 방지 */
        * {
            box-sizing: border-box;
        }

        body {
            /* 파스텔톤 배경 */
            background-color: #fdf5e6;
            background-image: 
                linear-gradient(90deg, rgba(162, 212, 195, 0.25) 50%, transparent 50%),
                linear-gradient(rgba(243, 178, 185, 0.25) 50%, transparent 50%);
            background-size: 60px 60px;
            color: #5c4332;
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* 모바일에서 상하좌우가 절대 잘리지 않도록 넉넉한 여백 추가 */
            padding: 70px 15px 50px 15px; 
            overflow-x: hidden;
        }
        
        /* 메인 컨테이너 */
        .game-window {
            background-color: #fffbf2;
            padding: 25px 20px;
            width: 100%;
            max-width: 420px; /* PC/태블릿에서는 너무 커지지 않도록 제한 */
            border: 5px solid #d4a373;
            border-radius: 25px;
            box-shadow: inset 0 0 0 8px #f4e8d3;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* 하단 입체 레이어 (가상 요소가 컨테이너 밖으로 과도하게 나가지 않게 조정) */
        .game-window::before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: -5px;
            right: -5px;
            height: 40px;
            background-color: #a2d4c3;
            border-radius: 0 0 25px 25px;
            border: 5px solid #d4a373;
            border-top: none;
            z-index: -1;
        }
        .game-window::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -5px;
            right: -5px;
            height: 40px;
            background-color: #f3b2b9;
            border-radius: 0 0 25px 25px;
            border: 5px solid #d4a373;
            border-top: none;
            z-index: -2;
            box-shadow: 0 10px 0px rgba(212, 163, 115, 0.3);
        }

        /* 상단 우드 간판 */
        .wood-sign {
            position: absolute;
            top: -45px;
            background-color: #d4a373;
            color: #fff;
            padding: 8px 25px;
            border-radius: 20px 20px 0 0;
            font-size: 24px;
            text-shadow: 2px 2px 0px #ab7a4b;
            border: 4px solid #ab7a4b;
            border-bottom: none;
            display: flex;
            align-items: center;
            white-space: nowrap;
            z-index: 10;
        }
        .wood-sign::before {
            content: '🍃';
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
        }

        /* 이름 입력 영역 */
        .name-section {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .name-input-wrapper {
            background-color: #f3e5d0;
            padding: 5px 10px;
            border-radius: 20px;
            border: 3px solid #d4a373;
            display: flex;
            align-items: center;
            position: relative;
        }
        .name-input-wrapper::after {
            content: '🍃';
            position: absolute;
            right: -25px;
            font-size: 20px;
        }
        input[type="text"] {
            font-family: 'Jua', sans-serif;
            background-color: transparent;
            color: #5c4332;
            border: none;
            width: 75px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        /* 구름 말풍선 */
        .speech-cloud {
            position: relative;
            background: #ffffff;
            color: #5c4332;
            font-size: 18px;
            padding: 25px 20px;
            width: 100%;
            border: 4px solid #d4a373;
            border-radius: 30px 20px 30px 20px;
            margin-top: 25px;
            margin-bottom: 25px;
            text-align: center;
            min-height: 30px;
            word-break: keep-all;
            box-shadow: 4px 4px 0px rgba(212, 163, 115, 0.3);
        }
        /* 말풍선 꼬리 */
        .speech-cloud::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-bottom: 4px solid #d4a373;
            border-right: 4px solid #d4a373;
            border-bottom-right-radius: 10px;
        }
        /* 장식들이 밖으로 나가지 않도록 안쪽으로 배치 */
        .deco { position: absolute; font-size: 18px; }
        .deco-1 { left: 8px; top: 8px; font-size: 20px; }
        .deco-2 { right: 10px; top: -12px; }
        .deco-3 { right: 8px; bottom: 8px; font-size: 16px; }
        .deco-4 { left: 15px; bottom: -12px; }

        /* 하단 레이아웃 (항상 세로 정렬 유지하여 모바일 최적화) */
        .bottom-content {
            display: flex;
            flex-direction: column; 
            width: 100%;
            align-items: center;
            gap: 20px;
        }

        /* 나무 액자 포토카드 */
        .photocard-wrapper {
            width: 160px;
            height: 220px; 
            background-color: #f3e5d0;
            border: 8px solid #d4a373;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(92, 67, 50, 0.2), 4px 4px 0 rgba(212, 163, 115, 0.3);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .photocard-wrapper:hover {
            transform: rotate(-2deg) scale(1.02);
        }
        .photocard-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 5px;
        }
        .upload-text {
            color: #a87e5b;
            font-size: 14px;
            text-align: center;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .upload-text .paw {
            font-size: 26px;
        }
        input[type="file"] {
            display: none;
        }

        /* 버튼 그룹 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            padding: 0 10px;
        }
        button {
            font-family: 'Jua', sans-serif;
            border: 4px solid #5c4332;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 18px;
            color: #5c4332;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.1s;
        }
        .btn-do { background-color: #c5e3d5; box-shadow: 0 5px 0px #8fae9f; } 
        .btn-buy { background-color: #f6c5c8; box-shadow: 0 5px 0px #c59b9d; } 
        .btn-eat { background-color: #fce19a; box-shadow: 0 5px 0px #c7af70; }
        
        button:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px transparent !important;
        }
        .btn-icon { font-size: 20px; }

        /* 화면이 조금 넓어지면 버튼과 포토카드를 가로로 예쁘게 배치 */
        @media (min-width: 450px) {
            .bottom-content {
                flex-direction: row;
                justify-content: center;
            }
            .button-group {
                width: auto;
                flex: 1;
                padding: 0;
            }
            .photocard-wrapper {
                margin-right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-window">
        <!-- 상단 간판 -->
        <div class="wood-sign">꼬모의 결정 헬퍼</div>
        
        <!-- 최애 이름 -->
        <div class="name-section">
            최애 이름 :
            <div class="name-input-wrapper">
                <input type="text" id="biasName" placeholder="이름" autocomplete="off">
            </div>
        </div>

        <!-- 말풍선 -->
        <div class="speech-cloud" id="speechBubble">
            <span class="deco deco-1">✨</span>
            <span class="deco deco-2">🍎</span>
            <span class="deco deco-3">💕</span>
            <span class="deco deco-4">🍓</span>
            고민되는 걸 꼬모에게 물어봐!
        </div>

        <!-- 하단 영역 -->
        <div class="bottom-content">
            <!-- 포토카드(사진 업로드) 영역 -->
            <label for="imageUpload" class="photocard-wrapper" id="photoWrapper">
                <div class="upload-text" id="uploadText">
                    <span class="paw">🐾</span>
                    사진을 넣어주세요!
                </div>
                <img id="previewImage" alt="최애 포토카드">
            </label>
            <input type="file" id="imageUpload" accept="image/*">

            <!-- 알약형 버튼 -->
            <div class="button-group">
                <button class="btn-do" onclick="decide('do')">
                    할까? 말까? <span class="btn-icon">🍃</span>
                </button>
                <button class="btn-buy" onclick="decide('buy')">
                    살까? 말까? <span class="btn-icon">👛</span>
                </button>
                <button class="btn-eat" onclick="decide('eat')">
                    먹을까? 말까? <span class="btn-icon">🧺</span>
                </button>
            </div>
        </div>
    </div>

    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const previewImage = document.getElementById('previewImage');
        const uploadText = document.getElementById('uploadText');
        const speechBubble = document.getElementById('speechBubble');
        const biasNameInput = document.getElementById('biasName');
        const popSound = document.getElementById('popSound');

        window.onload = function() {
            const savedName = localStorage.getItem('biasName');
            if (savedName) biasNameInput.value = savedName;

            const savedImage = localStorage.getItem('biasPhoto');
            if (savedImage) {
                previewImage.src = savedImage;
                previewImage.style.display = 'block';
                uploadText.style.display = 'none';
            }
        };

        biasNameInput.addEventListener('input', function(e) {
            localStorage.setItem('biasName', e.target.value);
        });

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64String = event.target.result;
                    previewImage.src = base64String;
                    previewImage.style.display = 'block';
                    uploadText.style.display = 'none';
                    localStorage.setItem('biasPhoto', base64String);
                };
                reader.readAsDataURL(file);
            }
        });

        const doList = [
            "할까 말까 할 때는 해야지!",
            "왠지 고민이 돼? 그럼 잠깐 쉴까?",
            "그래도 해야지~",
            "좀 더 고민해 보는 게 어때?"
        ];

        const buyList = [
            "당장 장바구니 ㄱㄱ",
            "지갑 닫자 통장 운다",
            "살까 말까 할 땐 사서 남겨",
            "이 돈 아껴서 나중에 더 좋은 거 사자"
        ];

        const eatList = [
            "참을 수 있다 ^^",
            "먹고 죽은 귀신이 때깔도 곱다!",
            "어~ 안 돼~ 응~ 아니야~",
            "뭐 해? 아직 안 시켰어?"
        ];

        function decide(type) {
            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("오디오 재생 권한이 필요할 수 있습니다."));

            const name = biasNameInput.value.trim() || '최애';
            
            speechBubble.style.opacity = 0;

            setTimeout(() => {
                let choice = "";
                if (type === 'do') choice = doList[Math.floor(Math.random() * doList.length)];
                else if (type === 'buy') choice = buyList[Math.floor(Math.random() * buyList.length)];
                else if (type === 'eat') choice = eatList[Math.floor(Math.random() * eatList.length)];
                
                speechBubble.innerHTML = `
                    <span class="deco deco-1">✨</span>
                    <span class="deco deco-2">🍎</span>
                    <span class="deco deco-3">💕</span>
                    <span class="deco deco-4">🍓</span>
                    <strong>[${name}] :</strong><br>${choice}
                `;
                speechBubble.style.opacity = 1;
            }, 200);
        }
    </script>
</body>
</html>
