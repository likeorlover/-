<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이제 고민하지 마! 내가 골라 줄게</title>
    <!-- 귀여운 둥근 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /* 깔끔한 하늘색 도트 배경 */
            background-color: #e0f2fe; 
            background-image: radial-gradient(#bae6fd 4px, transparent 4px);
            background-size: 30px 30px;
            color: #334155;
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 15px; 
            overflow-x: hidden;
        }

        /* 다이어리/책 전체 래퍼 */
        .planner-wrapper {
            width: 100%;
            max-width: 500px; /* 데스크탑, 모바일 모두 예쁘게 보이는 사이즈 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 책 인덱스 (탭) 영역 */
        .tabs-container {
            display: flex;
            justify-content: space-around;
            width: 90%;
            margin-bottom: -6px; /* 메인 창 테두리 아래로 숨기기 위해 아래로 내림 */
            position: relative;
            z-index: 0;
            gap: 8px;
        }

        .tab-btn {
            font-family: 'Jua', sans-serif;
            flex: 1;
            padding: 16px 5px 24px 5px; /* 아래쪽 패딩을 더 줘서 창 테두리에 자연스럽게 가려지게 함 */
            border-radius: 18px 18px 0 0;
            border: 5px solid;
            border-bottom: none;
            font-size: 18px;
            cursor: pointer;
            box-shadow: inset 0 5px 0px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
            text-align: center;
        }
        .tab-btn:active {
            transform: translateY(4px);
        }
        
        /* 각 탭의 색상 (파스텔톤) */
        .tab-do { background-color: #c6f6d5; border-color: #9ae6b4; color: #22543d; } /* 파스텔 민트 */
        .tab-buy { background-color: #fed7d7; border-color: #feb2b2; color: #742a2a; } /* 파스텔 핑크 */
        .tab-eat { background-color: #fefcbf; border-color: #faf089; color: #744210; } /* 파스텔 옐로 */

        /* 메인 컨테이너 (다이어리 속지 느낌) */
        .game-window {
            background-color: #ffffff;
            padding: 35px 25px;
            width: 100%;
            border: 6px solid #7dd3fc; /* 하늘색 톤 테두리 */
            border-radius: 25px;
            box-shadow: 
                0 15px 0px rgba(186, 230, 253, 0.6),
                inset 0 0 0 8px #f0f9ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* 메인 타이틀 */
        .main-title {
            color: #0ea5e9;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            background-color: #f0f9ff;
            padding: 10px 25px;
            border-radius: 20px;
            border: 3px dashed #bae6fd;
            letter-spacing: 0.5px;
        }

        /* 선택된 고민 종류 표시 영역 */
        .category-display {
            background-color: #e0f2fe;
            color: #0284c7;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #7dd3fc;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            width: 100%;
            text-align: center;
        }

        /* 구름 말풍선 */
        .speech-cloud {
            position: relative;
            background: #ffffff;
            color: #334155;
            font-size: 20px;
            padding: 25px 20px;
            width: 100%;
            border: 5px solid #7dd3fc;
            border-radius: 30px 20px 30px 20px;
            margin-top: 25px;
            margin-bottom: 35px;
            text-align: center;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            box-shadow: 5px 5px 0px #e0f2fe;
        }
        .speech-cloud::after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 25px;
            height: 25px;
            background-color: #ffffff;
            border-bottom: 5px solid #7dd3fc;
            border-right: 5px solid #7dd3fc;
            border-bottom-right-radius: 10px;
        }
        
        /* 꾸미기 장식 아이콘 */
        .deco { position: absolute; font-size: 20px; }
        .deco-1 { left: 12px; top: 10px; }
        .deco-2 { right: 15px; top: -14px; font-size: 24px; }
        .deco-3 { right: 12px; bottom: 10px; font-size: 18px; }
        .deco-4 { left: 18px; bottom: -14px; font-size: 22px; }

        /* 하단 영역 (포토카드 전용) */
        .bottom-content {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* 나무 액자 포토카드 -> 하늘색 프레임으로 변경 */
        .photocard-wrapper {
            width: 210px;
            height: 300px; 
            background-color: #f0f9ff;
            border: 8px solid #bae6fd;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(2, 132, 199, 0.1), 5px 5px 0 #e0f2fe;
            transition: transform 0.2s;
        }
        .photocard-wrapper:hover {
            transform: rotate(-2deg) scale(1.02);
            border-color: #7dd3fc;
        }
        .photocard-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 8px;
        }
        .upload-text {
            color: #7dd3fc;
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .upload-text .paw {
            font-size: 34px;
        }
        input[type="file"] {
            display: none;
        }

    </style>
</head>
<body>
    <div class="planner-wrapper">
        <!-- 상단 인덱스 탭 -->
        <div class="tabs-container">
            <button class="tab-btn tab-do" onclick="decide('do')">할까/말까</button>
            <button class="tab-btn tab-buy" onclick="decide('buy')">살까/말까</button>
            <button class="tab-btn tab-eat" onclick="decide('eat')">먹을까/말까</button>
        </div>

        <div class="game-window">
            <!-- 메인 타이틀 -->
            <div class="main-title">이제 고민하지 마! 내가 골라 줄게</div>
            
            <!-- 선택된 고민 종류 표시 -->
            <div class="category-display" id="categoryDisplay">
                위의 인덱스를 눌러서 고민을 선택해 봐! ☁️
            </div>

            <!-- 말풍선 -->
            <div class="speech-cloud" id="speechBubble">
                <span class="deco deco-1">✨</span>
                <span class="deco deco-2">🍎</span>
                <span class="deco deco-3">💕</span>
                <span class="deco deco-4">🍓</span>
                버튼을 누르면 내가 골라 줄게!
            </div>

            <!-- 하단 포토카드 전용 영역 -->
            <div class="bottom-content">
                <label for="imageUpload" class="photocard-wrapper" id="photoWrapper">
                    <div class="upload-text" id="uploadText">
                        <span class="paw">📸</span>
                        사진을 넣어주세요!
                    </div>
                    <img id="previewImage" alt="최애 포토카드">
                </label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>
    </div>

    <!-- 효과음 오디오 -->
    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const previewImage = document.getElementById('previewImage');
        const uploadText = document.getElementById('uploadText');
        const speechBubble = document.getElementById('speechBubble');
        const categoryDisplay = document.getElementById('categoryDisplay');
        const popSound = document.getElementById('popSound');

        window.onload = function() {
            const savedImage = localStorage.getItem('biasPhoto');
            if (savedImage) {
                previewImage.src = savedImage;
                previewImage.style.display = 'block';
                uploadText.style.display = 'none';
            }
        };

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64String = event.target.result;
                    previewImage.src = base64String;
                    previewImage.style.display = 'block';
                    uploadText.style.display = 'none';
                    localStorage.setItem('biasPhoto', base64String);
                };
                reader.readAsDataURL(file);
            }
        });

        const doList = [
            "할까 말까 할 때는 해야지",
            "왠지 고민이 돼? 그럼 잠깐 쉴까?",
            "그래도 해야지",
            "좀 더 고민해 보는 게 어때?"
        ];

        const buyList = [
            "당장 장바구니 ㄱㄱ",
            "지갑 닫자 통장 운다",
            "살까 말까 할 땐 사서 남겨",
            "이 돈 아껴서 나중에 더 좋은 거 사자"
        ];

        const eatList = [
            "참을 수 있다 ^^",
            "먹고 죽은 귀신이? 때깔도 곱다",
            "어~ 안 돼~ 응~ 아니야~",
            "뭐 해? 아직 안 시켰어?"
        ];

        let isRolling = false;

        function decide(type) {
            if (isRolling) return; 
            isRolling = true;

            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("오디오 재생 권한 필요"));

            let list = [];
            let categoryText = "";
            if (type === 'do') {
                list = doList;
                categoryText = "🌿 [ 할까? 말까? ] 고민 중...";
            } else if (type === 'buy') {
                list = buyList;
                categoryText = "👛 [ 살까? 말까? ] 고민 중...";
            } else if (type === 'eat') {
                list = eatList;
                categoryText = "🧺 [ 먹을까? 말까? ] 고민 중...";
            }

            categoryDisplay.innerText = categoryText;

            let counter = 0;
            let maxRolls = 12; 
            let rollInterval = setInterval(() => {
                let randomText = list[Math.floor(Math.random() * list.length)];
                speechBubble.innerHTML = `
                    <span class="deco deco-1">✨</span>
                    <span class="deco deco-2">🍎</span>
                    <span class="deco deco-3">💕</span>
                    <span class="deco deco-4">🍓</span>
                    ${randomText}
                `;
                counter++;

                if (counter >= maxRolls) {
                    clearInterval(rollInterval);
                    let finalChoice = list[Math.floor(Math.random() * list.length)];
                    
                    if (type === 'do') categoryText = "🌿 [ 할까? 말까? ] 결정 완료!";
                    else if (type === 'buy') categoryText = "👛 [ 살까? 말까? ] 결정 완료!";
                    else if (type === 'eat') categoryText = "🧺 [ 먹을까? 말까? ] 결정 완료!";
                    categoryDisplay.innerText = categoryText;

                    speechBubble.innerHTML = `
                        <span class="deco deco-1">✨</span>
                        <span class="deco deco-2">🍎</span>
                        <span class="deco deco-3">💕</span>
                        <span class="deco deco-4">🍓</span>
                        ${finalChoice}
                    `;
                    isRolling = false;
                }
            }, 60); 
        }
    </script>
</body>
</html>
