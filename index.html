<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이제 고민하지 마! 내가 골라 줄게</title>
    <!-- 귀여운 둥근 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            /* 동물의 숲 느낌의 파스텔 체크무늬 배경 */
            background-color: #fdf5e6;
            background-image: 
                linear-gradient(90deg, rgba(162, 212, 195, 0.25) 50%, transparent 50%),
                linear-gradient(rgba(243, 178, 185, 0.25) 50%, transparent 50%);
            background-size: 60px 60px;
            color: #5c4332;
            font-family: 'Jua', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            overflow-x: hidden;
        }
        
        /* 전체 컨테이너 완벽한 중앙 정렬 */
        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: auto;
        }

        /* ---------------- [ 인덱스 탭 ] ---------------- */
        .tabs {
            display: flex;
            justify-content: center;
            width: 92%;
            gap: 6px;
            margin-bottom: -5px; /* 창 안으로 쏙 들어가게 */
            z-index: 1;
        }

        .tab-btn {
            font-family: 'Jua', sans-serif;
            flex: 1;
            /* 시각적으로 보이는 영역의 정중앙에 글씨가 오도록 아래쪽 패딩을 더 줌 */
            padding: 10px 5px 15px 5px; 
            font-size: 15px; /* 모바일용 작은 폰트 */
            border: 4px solid #d4a373;
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.1s;
            box-shadow: inset 0 4px 0px rgba(255, 255, 255, 0.4);
            color: #5c4332;
        }
        
        .tab-btn:active {
            transform: translateY(4px);
        }

        /* 탭 색상: 숲 느낌의 파스텔톤 완벽 복구 */
        .tab-do { background-color: #c5e3d5; } 
        .tab-buy { background-color: #f6c5c8; }
        .tab-eat { background-color: #fce19a; }

        /* ---------------- [ 메인 게임 창 ] ---------------- */
        .game-window {
            background-color: #fffbf2;
            padding: 30px 20px 35px;
            width: 100%;
            border: 5px solid #d4a373; /* 따뜻한 우드 테두리 */
            border-radius: 25px;
            box-shadow: 
                inset 0 0 0 8px #f4e8d3,
                0 10px 0px rgba(212, 163, 115, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* 상단 우드 간판 */
        .wood-sign {
            background-color: #d4a373;
            color: #fff;
            padding: 6px 18px;
            border-radius: 18px;
            font-size: 17px; /* 모바일용 폰트 축소 */
            text-shadow: 2px 2px 0px #ab7a4b;
            border: 4px solid #ab7a4b;
            margin-top: -15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: relative;
        }
        .wood-sign::before, .wood-sign::after {
            content: '📌';
            position: absolute;
            font-size: 14px;
            top: -6px;
        }
        .wood-sign::before { left: 8px; }
        .wood-sign::after { right: 8px; }

        /* 상태 표시줄 */
        .category-display {
            background-color: #f3e5d0;
            color: #a87e5b;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 14px; /* 모바일용 폰트 축소 */
            border: 2px dashed #d4a373;
            margin-bottom: 15px;
            text-align: center;
            width: 90%;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 구름 말풍선 (폰트 크기에 맞게 여백/높이 축소) */
        .speech-cloud {
            position: relative;
            background: #ffffff;
            color: #5c4332;
            font-size: 15px; /* 모바일용 폰트 축소 */
            padding: 15px 18px; /* 패딩 축소 */
            width: 90%;
            border: 4px solid #d4a373;
            border-radius: 20px 15px 20px 15px;
            margin-bottom: 25px;
            text-align: center;
            min-height: 60px; /* 높이 대폭 축소 */
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
            box-shadow: 4px 4px 0px rgba(212, 163, 115, 0.2);
        }
        .speech-cloud::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 16px;
            height: 16px;
            background-color: #ffffff;
            border-bottom: 4px solid #d4a373;
            border-right: 4px solid #d4a373;
            border-bottom-right-radius: 6px;
        }
        
        .deco { position: absolute; font-size: 14px; }
        .deco-1 { left: 8px; top: 8px; }
        .deco-2 { right: 8px; top: -10px; font-size: 18px; }
        .deco-3 { right: 8px; bottom: 6px; font-size: 12px; }
        .deco-4 { left: 12px; bottom: -10px; font-size: 16px; }

        /* 나무 액자 포토카드 (모바일에서 사진 큼직하게) */
        .photocard-wrapper {
            width: 180px; /* 크기 확대 */
            height: 260px; /* 크기 확대 */
            background-color: #fdf5e6;
            border: 8px solid #d4a373;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(92, 67, 50, 0.2), 4px 4px 0 rgba(212, 163, 115, 0.3);
            transition: transform 0.2s;
        }
        .photocard-wrapper:hover {
            transform: rotate(-2deg) scale(1.02);
        }
        .photocard-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 6px;
        }
        .upload-text {
            color: #a87e5b;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .upload-text .paw {
            font-size: 32px;
        }
        input[type="file"] {
            display: none;
        }

        /* PC 화면에서는 전체적으로 사이즈를 키움 */
        @media (min-width: 500px) {
            .tab-btn { font-size: 18px; padding: 14px 10px 19px 10px; }
            .wood-sign { font-size: 22px; padding: 10px 24px; margin-top: -20px; }
            .category-display { font-size: 18px; min-height: 40px; }
            .speech-cloud { font-size: 18px; padding: 22px; min-height: 80px; }
            .deco { font-size: 18px; }
            .deco-2 { font-size: 24px; }
            .deco-4 { font-size: 22px; }
            .photocard-wrapper { width: 200px; height: 280px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 상단 아기자기한 인덱스 탭 (이모지 포함 & 완벽 중앙 정렬) -->
        <div class="tabs">
            <button class="tab-btn tab-do" onclick="decide('do')">할/말 🍃</button>
            <button class="tab-btn tab-buy" onclick="decide('buy')">살/말 👛</button>
            <button class="tab-btn tab-eat" onclick="decide('eat')">먹/말 🧺</button>
        </div>

        <div class="game-window">
            <!-- 다시 돌아온 귀여운 우드 간판 -->
            <div class="wood-sign">이제 고민하지 마! 내가 골라 줄게</div>
            
            <!-- 선택된 고민 종류 -->
            <div class="category-display" id="categoryDisplay">
                위에 있는 탭을 눌러봐! 🐾
            </div>

            <!-- 말풍선 (슬롯머신) - 폰트 크기에 맞춰 줄어든 여백 -->
            <div class="speech-cloud" id="speechBubble">
                <span class="deco deco-1">✨</span>
                <span class="deco deco-2">🍎</span>
                <span class="deco deco-3">💕</span>
                <span class="deco deco-4">🍓</span>
                버튼을 누르면 내가 골라 줄게!
            </div>

            <!-- 하단 포토카드 -->
            <label for="imageUpload" class="photocard-wrapper" id="photoWrapper">
                <div class="upload-text" id="uploadText">
                    <span class="paw">📸</span>
                    클릭해서<br>사진 넣기
                </div>
                <img id="previewImage" alt="최애 포토카드">
            </label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
    </div>

    <audio id="popSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const previewImage = document.getElementById('previewImage');
        const uploadText = document.getElementById('uploadText');
        const speechBubble = document.getElementById('speechBubble');
        const categoryDisplay = document.getElementById('categoryDisplay');
        const popSound = document.getElementById('popSound');

        window.onload = function() {
            const savedImage = localStorage.getItem('biasPhoto');
            if (savedImage) {
                previewImage.src = savedImage;
                previewImage.style.display = 'block';
                uploadText.style.display = 'none';
            }
        };

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64String = event.target.result;
                    previewImage.src = base64String;
                    previewImage.style.display = 'block';
                    uploadText.style.display = 'none';
                    localStorage.setItem('biasPhoto', base64String);
                };
                reader.readAsDataURL(file);
            }
        });

        const doList = [
            "할까 말까 할 때는 해야지",
            "왠지 고민이 돼? 그럼 잠깐 쉴까?",
            "그래도 해야지",
            "좀 더 고민해 보는 게 어때?"
        ];

        const buyList = [
            "당장 장바구니 ㄱㄱ",
            "지갑 닫자 통장 운다",
            "살까 말까 할 땐 사서 남겨",
            "이 돈 아껴서 나중에 더 좋은 거 사자"
        ];

        const eatList = [
            "참을 수 있다 ^^",
            "먹고 죽은 귀신이? 때깔도 곱다",
            "어~ 안 돼~ 응~ 아니야~",
            "뭐 해? 아직 안 시켰어?"
        ];

        let isRolling = false;

        function decide(type) {
            if (isRolling) return; 
            isRolling = true;

            popSound.currentTime = 0;
            popSound.play().catch(e => console.log("오디오 재생 권한 필요"));

            let list = [];
            let categoryText = "";
            if (type === 'do') {
                list = doList;
                categoryText = "🌿 [ 할/말 ] 고민 중...";
            } else if (type === 'buy') {
                list = buyList;
                categoryText = "👛 [ 살/말 ] 고민 중...";
            } else if (type === 'eat') {
                list = eatList;
                categoryText = "🧺 [ 먹/말 ] 고민 중...";
            }

            categoryDisplay.innerText = categoryText;

            let counter = 0;
            let maxRolls = 12; 
            let rollInterval = setInterval(() => {
                let randomText = list[Math.floor(Math.random() * list.length)];
                speechBubble.innerHTML = `
                    <span class="deco deco-1">✨</span>
                    <span class="deco deco-2">🍎</span>
                    <span class="deco deco-3">💕</span>
                    <span class="deco deco-4">🍓</span>
                    ${randomText}
                `;
                counter++;

                if (counter >= maxRolls) {
                    clearInterval(rollInterval);
                    let finalChoice = list[Math.floor(Math.random() * list.length)];
                    
                    if (type === 'do') categoryText = "🌿 [ 할까? 말까? ] 결정 완료!";
                    else if (type === 'buy') categoryText = "👛 [ 살까? 말까? ] 결정 완료!";
                    else if (type === 'eat') categoryText = "🧺 [ 먹을까? 말까? ] 결정 완료!";
                    categoryDisplay.innerText = categoryText;

                    speechBubble.innerHTML = `
                        <span class="deco deco-1">✨</span>
                        <span class="deco deco-2">🍎</span>
                        <span class="deco deco-3">💕</span>
                        <span class="deco deco-4">🍓</span>
                        ${finalChoice}
                    `;
                    isRolling = false;
                }
            }, 60); 
        }
    </script>
</body>
</html>
